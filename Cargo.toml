[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sim-cli",
    "crates/ts2-import",
    "crates/protocol",
    "crates/game",
    "crates/bot",
    "crates/ipc",
    "crates/server",
    "crates/client-core",
    "crates/client-ui",
    "crates/client-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
# No default features: the sim needs no OS randomness, and getrandom does not
# build for wasm32-unknown-unknown (the browser client). The server adds `thread_rng`.
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
tokio = "1.53"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie-signed"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
base64 = "0.22"
# The browser client (D1). egui for the screens; eframe (web runner, wgpu) only in client-web.
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
# Pinned exactly: wasm-bindgen-cli must be this same version (scripts/build-web.sh checks).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"

# The browser client's wasm (scripts/build-web.sh): small rather than fast.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
